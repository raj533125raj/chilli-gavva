name: agent-cycle

on:
  schedule:
    - cron: "17 * * * *" # once an hour (free-minutes safe)
  workflow_dispatch:
    inputs:
      slot:
        description: "Force scheduler slot (morning/midday/afternoon/evening)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: agent-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run tests first
        env:
          CHILLI_TEST: "1"
        run: python3 -m unittest discover -s tests

      - name: Run scheduled recipe (if slot matches now)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          if [ -n "$SLOT" ]; then
            python3 scheduler.py --slot "$SLOT"
          else
            python3 scheduler.py
          fi

      - name: Auto-seed if queue is idle
        run: python3 topic_pool.py

      - name: Run one agent cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 cloud_runner.py

      - name: Telegram inbox (approve/reject from phone + new draft alerts)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 telegram_inbox.py

      - name: Export approved content
        run: python3 content_export.py

      - name: Save state
        run: |
          git config user.name "chilli-gavva-bot"
          git config user.email "chilli-gavva-bot@users.noreply.github.com"
          git add agent_data.db web/data/status.json exported_content/ .scheduler_locks/ || true
          git diff --cached --quiet || (git commit -m "agent: state + content update [skip ci]" && git push)
