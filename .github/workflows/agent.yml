name: agent-cycle

on:
  schedule:
    # Backup only. The free Cloudflare "alarm clock" (docs/ALWAYS_ON.md) starts runs every 30 min.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Force scheduler slot (morning/midday/afternoon/evening)"
        required: false
        default: ""
      reason:
        description: "Who started this run (alarm, doorbell, manual)"
        required: false
        default: "manual"
      force:
        description: "Run even if the Mac worker is alive (yes/no)"
        required: false
        default: "no"
      health:
        description: "Run the AI health check first (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write
  models: read   # GitHub Models (free preview AI); switched on only by the repo variable GITHUB_MODELS

concurrency:
  group: agent-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      # Start from the NEWEST main, not the commit that queued this run. Runs wait in line
      # (concurrency group), so the run before this one may already have saved a newer database.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Manual only (Run workflow -> health = yes): one tiny test per AI model + one long-answer test.
      # Prints provider, model, OK/FAIL, error number or timeout, seconds. Never prints keys.
      - name: AI health check (manual only)
        if: github.event.inputs.health == 'yes'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS: ${{ vars.GITHUB_MODELS }}
        run: python3 llm_router.py health

      # One writer at a time: when the Mac worker is alive this run stands down (all steps skip).
      - name: Skip if the Mac worker is running
        id: gate
        env:
          ALWAYS_ON_URL: ${{ secrets.ALWAYS_ON_URL }}
          ALWAYS_ON_SECRET: ${{ secrets.ALWAYS_ON_SECRET }}
          REASON: ${{ github.event.inputs.reason || github.event_name }}
          FORCE: ${{ github.event.inputs.force || 'no' }}
        run: python3 always_on.py gate --reason "$REASON" --force "$FORCE"

      - name: Run tests first
        if: steps.gate.outputs.run == 'true'
        env:
          CHILLI_TEST: "1"
        run: |
          python3 -m unittest discover -s tests
          # Some tests write to the real database / status file. Put the committed copies back
          # (and drop files tests created) so test data is never saved by "Save state".
          git checkout -- agent_data.db web/data/status.json
          git clean -fdq -- exported_content .scheduler_locks

      - name: Run scheduled recipe (if slot matches now)
        if: steps.gate.outputs.run == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS: ${{ vars.GITHUB_MODELS }}
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          if [ -n "$SLOT" ]; then
            python3 scheduler.py --slot "$SLOT"
          else
            python3 scheduler.py
          fi

      - name: Run one agent cycle
        if: steps.gate.outputs.run == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS: ${{ vars.GITHUB_MODELS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 cloud_runner.py

      - name: Telegram inbox (buttons, commands, new draft alerts, daily report)
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # read-only: the daily report asks the alarm clock how many minutes ran this month
          ALWAYS_ON_URL: ${{ secrets.ALWAYS_ON_URL }}
          ALWAYS_ON_SECRET: ${{ secrets.ALWAYS_ON_SECRET }}
        run: python3 telegram_inbox.py

      - name: Export approved content
        if: steps.gate.outputs.run == 'true'
        run: python3 content_export.py

      # Standard library only (xlsx/docx/pdf are written directly), so nothing to install.
      # A builder error never blocks "Save state"; unfinished drafts are retried next run.
      - name: Build product files from approved drafts
        if: steps.gate.outputs.run == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS: ${{ vars.GITHUB_MODELS }}
        run: python3 product_builder.py --max 2 || echo "Product Builder hit an error; it will retry next run."

      - name: Save state
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "chilli-gavva-bot"
          git config user.email "chilli-gavva-bot@users.noreply.github.com"
          # Save only when something real changed (rows, dashboard numbers, product files), not when a
          # quiet run only rewrote the database file bytes or the dashboard timestamp.
          set +e
          python3 save_check.py
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then
            echo "Nothing real changed: not saving."
            exit 0
          fi
          # Add each path on its own: one missing folder must not stop everything else being saved
          for p in agent_data.db web/data/status.json exported_content .scheduler_locks; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -q -m "agent: state + content update [skip ci]"
          STATE="agent_data.db web/data/status.json exported_content .scheduler_locks"
          for attempt in 1 2; do
            if git push -q origin HEAD:main; then
              echo "State saved."
              exit 0
            fi
            echo "Push refused: main moved during this run (attempt $attempt)."
            git fetch -q origin main
            # A database cannot be merged. Replay our save on top of the new main ONLY when the
            # new commits did not touch the saved files (e.g. a code change). If another writer
            # (another run or the Mac worker) saved state meanwhile, never overwrite it: fail, so
            # the Telegram alert below fires. Never force-push.
            if ! git diff --quiet HEAD~1 origin/main -- $STATE; then
              echo "Someone else saved newer state while this run worked; not overwriting it."
              exit 1
            fi
            if ! git rebase -q origin/main; then
              git rebase --abort || true
              echo "Could not replay this run's save on the new main."
              exit 1
            fi
          done
          echo "Could not save state after a retry."
          exit 1

      - name: Report minutes to the alarm clock
        if: always()
        env:
          ALWAYS_ON_URL: ${{ secrets.ALWAYS_ON_URL }}
          ALWAYS_ON_SECRET: ${{ secrets.ALWAYS_ON_SECRET }}
        run: python3 always_on.py report

      # Never fail silently: if any step above failed, send a short Telegram alert with the run link.
      - name: Alert on Telegram if this run failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -c "import os, notify; notify.send('Chilli Gavva - an agent run FAILED. Details - ' + os.environ.get('RUN_URL', ''))" || true
