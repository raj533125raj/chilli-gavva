name: agent-cycle

on:
  workflow_run:
    workflows: [Robot auto-fix checks, Robot auto-fix]
    types: [completed]
  schedule:
    # Backup only. The free Cloudflare "alarm clock" (docs/ALWAYS_ON.md) starts runs every 30 min.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Force scheduler slot (morning/midday/afternoon/evening)"
        required: false
        default: ""
      reason:
        description: "Who started this run (alarm, doorbell, manual)"
        required: false
        default: "manual"
      force:
        description: "Run even if the Mac worker is alive (yes/no)"
        required: false
        default: "no"
      health:
        description: "Run the AI health check first (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write
  actions: write
  pull-requests: write
  checks: read
  statuses: read
  models: read   # GitHub Models (free preview AI); switched on only by the repo variable GITHUB_MODELS

concurrency:
  group: agent-cycle
  cancel-in-progress: false

jobs:
  cycle:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      inbox_started: ${{ steps.inbox.outputs.started }}
    steps:
      # First step. The database is committed encrypted, so without the DB_KEY secret nothing can run.
      # The job stops here, before any step that reads or writes the database. The key is never printed.
      - name: Check the database key
        env:
          DB_KEY: ${{ secrets.DB_KEY }}
        run: |
          if [ -z "$DB_KEY" ]; then
            echo "DB_KEY not set"
            printf '%s\n' 'Step: Check the database key' 'Problem: The database key is not configured.' > "$RUNNER_TEMP/failure.txt"
            exit 1
          fi

      # Start from the NEWEST main, not the commit that queued this run. Runs wait in line
      # (concurrency group), so the run before this one may already have saved a newer database.
      - uses: actions/checkout@v5
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        with:
          ref: main
          fetch-depth: 0

      # This state survives even when tests or the database save fail.
      - name: Restore failure counter
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/robot-failure-state.json
          key: robot-failure-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: robot-failure-v1-

      # Keep the dependency definition in this workflow: no new tracked dependency file.
      # setup-python hashes this generated requirements file for its pip download cache.
      - name: Write image requirements
        timeout-minutes: 1
        run: printf '%s\n' 'Pillow==11.3.0' > .agent-image-requirements.txt

      - uses: actions/setup-python@v6
        timeout-minutes: 2
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .agent-image-requirements.txt

      # Open the database for this run. The plaintext file exists only on this runner and is never committed.
      - name: Open the database
        timeout-minutes: 1
        env:
          DB_KEY: ${{ secrets.DB_KEY }}
        run: python3 run_failure.py run decrypt -- python3 scripts/db_crypt.py decrypt

      - name: Unpack private products
        timeout-minutes: 2
        env:
          DB_KEY: ${{ secrets.DB_KEY }}
        run: python3 run_failure.py run unpack -- python3 scripts/db_crypt.py unpack-products

      # Manual only (Run workflow -> health = yes): one tiny test per AI model + one long-answer test.
      # Prints provider, model, OK/FAIL, error number or timeout, seconds. Never prints keys.
      - name: AI health check (manual only)
        if: github.event.inputs.health == 'yes'
        timeout-minutes: 5
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS: ${{ vars.GITHUB_MODELS }}
        run: python3 run_failure.py run health -- python3 llm_router.py health

      # Every run: report any secret or private data in the repository (the Save state step blocks on it).
      - name: Secret guard (report)
        continue-on-error: true
        timeout-minutes: 2
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALWAYS_ON_SECRET: ${{ secrets.ALWAYS_ON_SECRET }}
          ALWAYS_ON_URL: ${{ secrets.ALWAYS_ON_URL }}
        run: python3 secret_guard.py

      # One writer at a time: when the Mac worker is alive this run stands down (all steps skip).
      - name: Skip if the Mac worker is running
        id: gate
        timeout-minutes: 1
        env:
          ALWAYS_ON_URL: ${{ secrets.ALWAYS_ON_URL }}
          ALWAYS_ON_SECRET: ${{ secrets.ALWAYS_ON_SECRET }}
          REASON: ${{ github.event.inputs.reason || github.event_name }}
          FORCE: ${{ github.event.inputs.force || 'no' }}
        run: python3 always_on.py gate --reason "$REASON" --force "$FORCE"

      # Record the actual checkout SHA, not github.sha (checkout follows newest main).
      # A cache miss or any comparison error keeps the full suite enabled.
      - name: Restore last green revision
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/robot-green-sha.txt
          key: robot-green-code-v1-${{ runner.os }}-py311-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: robot-green-code-v1-${{ runner.os }}-py311-

      - name: Check whether the full suite is needed
        id: test_plan
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          head=$(git rev-parse HEAD)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          run=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ -f "$RUNNER_TEMP/robot-green-sha.txt" ]; then
            base=$(cat "$RUNNER_TEMP/robot-green-sha.txt")
            if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$base" "$head"; then
              # Everything except known state/docs counts as code, including tests,
              # workflows, recipes, configuration and future file types.
              if git diff --quiet "$base" "$head" -- . \
                ':!agent_data.db.enc' ':!products.tar.gz.enc' ':!web/data/status.json' \
                ':!.scheduler_locks' ':(exclude,glob)docs/**/*.md' ':!README.md'; then
                run=false
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Full unit suite required: $run"

      # Preserve image-test coverage on full test runs, even without a pending build.
      - name: Install test dependencies
        if: steps.gate.outputs.run == 'true' && steps.test_plan.outputs.run != 'false'
        timeout-minutes: 4
        run: |
          python3 -m pip install --quiet --disable-pip-version-check -r .agent-image-requirements.txt
          # Product/launch-pack tests need poppler (PDF page pictures) and the URW fonts, same as real builds.
          if [ "$(dpkg-query -W -f='${Status}' poppler-utils 2>/dev/null)" != "install ok installed" ]; then
            sudo apt-get -o Acquire::Retries=3 update -qq
          fi
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends poppler-utils fonts-urw-base35 > /dev/null
          python3 -c "import mockups; print('Image tools ready:', mockups.available())"

      - name: Run tests first
        id: tests
        if: steps.gate.outputs.run == 'true' && steps.test_plan.outputs.run != 'false'
        timeout-minutes: 5
        env:
          CHILLI_TEST: "1"
          DB_KEY: ${{ secrets.DB_KEY }}
        run: |
          python3 run_failure.py run tests -- bash -e -o pipefail <<'ROBOT_STEP'
          python3 -m unittest discover -s tests
          # Some tests write to the real database / status file. Put the committed copies back
          # (and drop files tests created) so test data is never saved by "Save state".
          git checkout -- web/data/status.json agent_data.db.enc products.tar.gz.enc .scheduler_locks
          python3 scripts/db_crypt.py decrypt
          git clean -fdq -- exported_content .scheduler_locks
          ROBOT_STEP

      - name: Run scheduled recipe (if slot matches now)
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 3
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS: ${{ vars.GITHUB_MODELS }}
        run: |
          python3 run_failure.py run scheduler -- bash -e -o pipefail <<'ROBOT_STEP'
          SLOT="${{ github.event.inputs.slot }}"
          if [ -n "$SLOT" ]; then
            python3 scheduler.py --slot "$SLOT"
          else
            python3 scheduler.py
          fi
          ROBOT_STEP

      - name: Run one agent cycle
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 9
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS: ${{ vars.GITHUB_MODELS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 run_failure.py run cycle -- python3 cloud_runner.py

      - name: Telegram inbox (buttons, commands, new draft alerts, daily report)
        id: inbox
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 6
        env:
          # Signed office agent questions use the same guarded provider chain as workforce tasks.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS: ${{ vars.GITHUB_MODELS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # read-only: the daily report asks the alarm clock how many minutes ran this month
          ALWAYS_ON_URL: ${{ secrets.ALWAYS_ON_URL }}
          ALWAYS_ON_SECRET: ${{ secrets.ALWAYS_ON_SECRET }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CONTROL_SIGNING_KEY: ${{ secrets.CONTROL_SIGNING_KEY }}
        run: |
          echo "started=true" >> "$GITHUB_OUTPUT"
          python3 run_failure.py run inbox -- python3 telegram_inbox.py

      - name: Export approved content
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 2
        run: python3 run_failure.py run export -- python3 content_export.py

      # Recheck after Telegram: approvals made in this very run must get their images.
      # The builder still runs even if there is no image work, retaining its bookkeeping.
      - name: Check for approved product builds
        id: image_work
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          import os
          import cubes
          import guardrails
          import product_builder
          needed = (guardrails.automation_allowed() and cubes.get_cube_state('product') == 'on'
                    and any(product_builder.niche_of(item['title']) for item in product_builder._todo()))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('needed=' + str(needed).lower(), file=output)
          PY

      # Free listing-image tools: install apt packages only for eligible approved drafts.
      # If the probe fails, try installation so an optimization cannot remove images.
      - name: Install free image tools
        if: steps.gate.outputs.run == 'true' && steps.image_work.outputs.needed != 'false'
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python3 -m pip install --quiet --disable-pip-version-check -r .agent-image-requirements.txt
          missing=()
          for package in poppler-utils fonts-urw-base35; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null)" != "install ok installed" ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends "${missing[@]}" > /dev/null
          fi
          python3 -c "import mockups; print('Image tools ready:', mockups.available())"

      # Standard library only (xlsx/docx/pdf are written directly), so nothing to install.
      # A builder error never blocks "Save state"; unfinished drafts are retried next run.
      - name: Build product files from approved drafts
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 6
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS: ${{ vars.GITHUB_MODELS }}
          # only for the one-line "ready / needs fix" build message to the owner chat
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 run_failure.py run build -- python3 product_builder.py --max 2

      - name: Pack private products
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 2
        env:
          DB_KEY: ${{ secrets.DB_KEY }}
        run: python3 run_failure.py run pack -- python3 scripts/db_crypt.py pack-products

      - name: Save state
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 3
        env:
          # Only for the secret guard: it looks for these exact values in memory and never prints them.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CONTROL_SIGNING_KEY: ${{ secrets.CONTROL_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALWAYS_ON_SECRET: ${{ secrets.ALWAYS_ON_SECRET }}
          ALWAYS_ON_URL: ${{ secrets.ALWAYS_ON_URL }}
          # Only to encrypt the database and to compare it with the committed copy. Never printed.
          DB_KEY: ${{ secrets.DB_KEY }}
        run: |
          python3 run_failure.py run save -- bash -e -o pipefail <<'ROBOT_STEP'
          # Secret guard: never save a token, key, password, chat id or personal email (blocks the save).
          python3 sanitize_state.py
          python3 secret_guard.py --save
          git config user.name "chilli-gavva-bot"
          git config user.email "chilli-gavva-bot@users.noreply.github.com"
          # Save only when something real changed (rows, dashboard numbers, product files), not when a
          # quiet run only rewrote the database file bytes or the dashboard timestamp.
          set +e
          python3 save_check.py
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then
            echo "Nothing real changed: not saving."
            exit 0
          fi
          if [ "$rc" != "0" ]; then
            echo "Could not check state changes."
            exit "$rc"
          fi
          # Encrypt the database. Only the encrypted file (agent_data.db.enc) is committed, never the plaintext.
          python3 scripts/db_crypt.py encrypt
          # Add each path on its own: one missing folder must not stop everything else being saved
          for p in agent_data.db.enc products.tar.gz.enc web/data/status.json .scheduler_locks; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -q -m "agent: state + content update [skip ci]"
          STATE="agent_data.db.enc products.tar.gz.enc web/data/status.json .scheduler_locks"
          bash scripts/push_state.sh $STATE
          ROBOT_STEP

      - name: Report minutes to the alarm clock
        if: always()
        timeout-minutes: 1
        env:
          ALWAYS_ON_URL: ${{ secrets.ALWAYS_ON_URL }}
          ALWAYS_ON_SECRET: ${{ secrets.ALWAYS_ON_SECRET }}
        run: python3 run_failure.py run report -- python3 always_on.py report

      - name: Update failure counter and alert on a repeated failure
        id: failure_result
        if: always()
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_STATUS: ${{ job.status }}
          ROBOT_RAN: ${{ steps.gate.outputs.run }}
        run: python3 run_failure.py finish

      - name: Save failure counter even when this run failed
        if: always() && steps.failure_result.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/robot-failure-state.json
          key: robot-failure-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # Advance the baseline only after the entire cycle is green. A skipped suite
      # is safe here only because the SHA comparison proved the code unchanged.
      - name: Remember green code revision
        id: green_revision
        if: success() && steps.gate.outputs.run == 'true' && steps.test_plan.outcome == 'success' && (steps.tests.outcome == 'success' || steps.test_plan.outputs.run == 'false')
        continue-on-error: true
        timeout-minutes: 1
        env:
          TESTED_SHA: ${{ steps.test_plan.outputs.head }}
        run: printf '%s\n' "$TESTED_SHA" > "$RUNNER_TEMP/robot-green-sha.txt"

      - name: Save green code revision
        if: success() && steps.green_revision.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/robot-green-sha.txt
          key: robot-green-code-v1-${{ runner.os }}-py311-${{ github.run_id }}-${{ github.run_attempt }}

  recovery_inbox:
    needs: cycle
    if: always() && needs.cycle.outputs.inbox_started != 'true' && (needs.cycle.result == 'failure' || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Robot auto-fix checks'))
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Handle owner buttons even while the main tests are failing
        env:
          DB_KEY: ${{ secrets.DB_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 run_failure.py run inbox -- bash -e -o pipefail <<'ROBOT_RECOVERY'
          python3 scripts/db_crypt.py decrypt
          cp agent_data.db "$RUNNER_TEMP/owner-before.db"
          python3 telegram_inbox.py --recovery
          if cmp -s agent_data.db "$RUNNER_TEMP/owner-before.db"; then exit 0; fi
          python3 sanitize_state.py
          python3 secret_guard.py agent_data.db
          python3 scripts/db_crypt.py encrypt
          git config user.name "chilli-gavva-bot"
          git config user.email "chilli-gavva-bot@users.noreply.github.com"
          git add agent_data.db.enc
          if ! git diff --cached --quiet; then
            git commit -q -m "agent: owner inbox state [skip ci]"
            bash scripts/push_state.sh agent_data.db.enc
          fi
          ROBOT_RECOVERY

  autofix_result:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Robot auto-fix' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/robot-failure-state.json
          key: robot-failure-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: robot-failure-v1-
      - name: Schedule a patient retry or report a terminal failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 autofix_retry.py receive
      - uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/robot-failure-state.json
          key: robot-failure-v1-${{ github.run_id }}-${{ github.run_attempt }}
