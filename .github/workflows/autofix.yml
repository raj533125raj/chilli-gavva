name: Robot auto-fix

on:
  workflow_dispatch:
    inputs:
      summary:
        description: 'Safe failure summary (Step: X | Problem: Y)'
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: robot-autofix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      enabled: ${{ steps.key.outputs.enabled }}
    steps:
      - name: Check whether auto-fix is configured
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Auto-fix unavailable: GEMINI_API_KEY is not configured."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          if [ -n "$NVIDIA_API_KEY" ]; then
            echo "nvidia=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$GROQ_API_KEY" ]; then
            echo "groq=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.enabled == 'true'
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        if: steps.key.outputs.enabled == 'true'
        with:
          python-version: '3.11'
      - name: Prepare safe request
        id: prompt
        if: steps.key.outputs.enabled == 'true'
        env:
          FAILURE_SUMMARY: ${{ inputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 autofix.py prompt
      - name: Find the cause and propose a fix with Gemini
        id: gemini
        if: steps.key.outputs.enabled == 'true'
        continue-on-error: true
        timeout-minutes: 6
        uses: anomalyco/opencode/github@latest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          share: false
          model: google/gemini-3.8-flash
          prompt: ${{ steps.prompt.outputs.prompt }}
      - name: Retry the fix with NVIDIA
        id: nim
        if: ${{ !cancelled() && steps.gemini.outcome == 'failure' && steps.key.outputs.nvidia == 'true' }}
        continue-on-error: true
        timeout-minutes: 6
        uses: anomalyco/opencode/github@latest
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          share: false
          model: nim/deepseek-ai/deepseek-v4.1-flash
          prompt: ${{ steps.prompt.outputs.prompt }}
      - name: Retry a small request with Groq last
        id: groq
        if: ${{ !cancelled() && steps.gemini.outcome == 'failure' && steps.nim.outcome != 'success' && steps.key.outputs.groq == 'true' && steps.prompt.outputs.groq_small == 'true' }}
        continue-on-error: true
        timeout-minutes: 6
        uses: anomalyco/opencode/github@latest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          share: false
          model: groq/openai/gpt-oss-120b
          prompt: ${{ steps.prompt.outputs.prompt }}
      - name: Check that a provider completed the fix
        if: ${{ !cancelled() && steps.gemini.outcome == 'failure' && steps.nim.outcome != 'success' && steps.groq.outcome != 'success' }}
        run: |
          echo "Auto-fix providers could not complete the request."
          exit 1

  prepare:
    needs: fix
    if: needs.fix.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Validate the proposed files and request tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 autofix.py prepare-checks

  failed:
    needs: [fix, prepare]
    if: always() && (needs.fix.result == 'failure' || needs.prepare.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Explain that manual repair is needed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 autofix.py failed
