name: Robot auto-fix

on:
  workflow_dispatch:
    inputs:
      summary:
        description: 'Safe failure summary (Step: X | Problem: Y)'
        type: string
        required: true
      problem:
        description: Existing problem identifier (empty for a new owner request)
        type: string
        default: ''
      attempt:
        description: Attempt within the same problem (1, 2, or 3)
        type: string
        default: '1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: robot-autofix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      enabled: ${{ steps.key.outputs.enabled }}
      proposal: ${{ steps.verify_gemini.outputs.proposal == 'true' || steps.verify_nim.outputs.proposal == 'true' || steps.verify_groq.outputs.proposal == 'true' }}
      busy: ${{ steps.gemini.outputs.busy == 'true' && (steps.nim.outcome == 'skipped' || steps.nim.outputs.busy == 'true') && (steps.groq.outcome == 'skipped' || steps.groq.outputs.busy == 'true') }}
    steps:
      - name: Check whether auto-fix is configured
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_AUTOFIX_KEY || secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Auto-fix unavailable: GEMINI_API_KEY is not configured."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          if [ -n "$NVIDIA_API_KEY" ]; then
            echo "nvidia=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$GROQ_API_KEY" ]; then
            echo "groq=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.enabled == 'true'
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        if: steps.key.outputs.enabled == 'true'
        with:
          python-version: '3.11'
      - name: Prepare safe request
        id: prompt
        if: steps.key.outputs.enabled == 'true'
        timeout-minutes: 1
        env:
          FAILURE_SUMMARY: ${{ inputs.summary }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOFIX_STATE: ${{ runner.temp }}/autofix-control/state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 autofix.py prompt
          # Keep the verifier from main outside the provider's working tree.
          mkdir -p "$RUNNER_TEMP/autofix-control"
          cp autofix.py run_failure.py notify.py secret_guard.py autofix_retry.py "$RUNNER_TEMP/autofix-control/"
          python3 "$RUNNER_TEMP/autofix-control/autofix.py" result-start
      - name: Install OpenCode
        if: steps.key.outputs.enabled == 'true'
        timeout-minutes: 2
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Find the cause and propose a fix with Gemini
        id: gemini
        if: steps.key.outputs.enabled == 'true'
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_AUTOFIX_KEY || secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GITHUB_TOKEN: 'true'
          SHARE: 'false'
          MODEL: google/gemini-3.8-flash
          PROMPT: ${{ steps.prompt.outputs.prompt }}
        run: python3 "$RUNNER_TEMP/autofix-control/autofix.py" provider-run
      - name: Verify the Gemini proposal on GitHub
        id: verify_gemini
        if: ${{ !cancelled() && steps.prompt.outcome == 'success' && steps.key.outputs.enabled == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOFIX_STATE: ${{ runner.temp }}/autofix-control/state.json
        run: python3 "$RUNNER_TEMP/autofix-control/autofix.py" result-check
      - name: Retry the fix with NVIDIA
        id: nim
        if: ${{ !cancelled() && steps.prompt.outcome == 'success' && steps.key.outputs.enabled == 'true' && steps.verify_gemini.outputs.proposal != 'true' && steps.key.outputs.nvidia == 'true' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GITHUB_TOKEN: 'true'
          SHARE: 'false'
          MODEL: nim/deepseek-ai/deepseek-v4.1-flash
          PROMPT: ${{ steps.prompt.outputs.prompt }}
        run: python3 "$RUNNER_TEMP/autofix-control/autofix.py" provider-run
      - name: Verify the NVIDIA proposal on GitHub
        id: verify_nim
        if: ${{ !cancelled() && steps.prompt.outcome == 'success' && steps.key.outputs.enabled == 'true' && steps.verify_gemini.outputs.proposal != 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOFIX_STATE: ${{ runner.temp }}/autofix-control/state.json
        run: python3 "$RUNNER_TEMP/autofix-control/autofix.py" result-check
      - name: Retry a small request with Groq last
        id: groq
        if: ${{ !cancelled() && steps.prompt.outcome == 'success' && steps.key.outputs.enabled == 'true' && steps.verify_gemini.outputs.proposal != 'true' && steps.verify_nim.outputs.proposal != 'true' && steps.key.outputs.groq == 'true' && steps.prompt.outputs.groq_small == 'true' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GITHUB_TOKEN: 'true'
          SHARE: 'false'
          MODEL: groq/openai/gpt-oss-120b
          PROMPT: ${{ steps.prompt.outputs.prompt }}
        run: python3 "$RUNNER_TEMP/autofix-control/autofix.py" provider-run
      - name: Verify the final proposal on GitHub
        id: verify_groq
        if: ${{ !cancelled() && steps.prompt.outcome == 'success' && steps.key.outputs.enabled == 'true' && steps.verify_gemini.outputs.proposal != 'true' && steps.verify_nim.outputs.proposal != 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOFIX_STATE: ${{ runner.temp }}/autofix-control/state.json
        run: python3 "$RUNNER_TEMP/autofix-control/autofix.py" result-check
      - name: Check that a provider completed the fix
        if: ${{ !cancelled() && steps.key.outputs.enabled == 'true' && steps.verify_gemini.outputs.proposal != 'true' && steps.verify_nim.outputs.proposal != 'true' && steps.verify_groq.outputs.proposal != 'true' }}
        run: |
          echo "Auto-fix providers could not complete the request."
          exit 1

  prepare:
    needs: fix
    if: needs.fix.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Validate the proposed files and request tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 autofix.py prepare-checks

  result:
    needs: [fix, prepare]
    if: always() && !cancelled() && needs.fix.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Record only the safe auto-fix outcome
        env:
          FAILURE_SUMMARY: ${{ inputs.summary }}
          AUTOFIX_PROBLEM: ${{ inputs.problem }}
          AUTOFIX_ATTEMPT: ${{ inputs.attempt }}
          AUTOFIX_PROPOSAL: ${{ needs.fix.outputs.proposal == 'true' && needs.prepare.result == 'success' }}
          AUTOFIX_BUSY: ${{ needs.fix.outputs.proposal != 'true' && needs.fix.outputs.busy == 'true' }}
        run: python3 autofix_retry.py record
      - uses: actions/upload-artifact@v4
        with:
          name: robot-autofix-result
          path: ${{ runner.temp }}/autofix-result.json
          retention-days: 3
          if-no-files-found: error
